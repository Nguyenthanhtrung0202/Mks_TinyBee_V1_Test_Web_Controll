<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TinyBee 5 trục</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font:16px system-ui,sans-serif}.wrap{max-width:740px;margin:auto;padding:26px 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 22px #0000000d}h1{margin:0;font-size:29px}p,.muted{color:#6e6e73}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8e8e93;margin-right:7px}.ok{background:#34c759}.bad{background:#ff3b30}label{display:block;font-size:13px;color:#6e6e73;margin-bottom:6px}input,textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font:inherit;background:#fafafa}textarea{min-height:96px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.axes{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.buttons{display:flex;gap:10px;margin-top:14px}button{border:0;border-radius:11px;padding:12px 15px;background:#007aff;color:#fff;font-weight:650;font-size:15px;cursor:pointer}.stop{background:#ff3b30}.status{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.axis{background:#f5f5f7;padding:10px;border-radius:10px;text-align:center}.axis b{display:block;font-size:12px;color:#6e6e73;margin-bottom:4px}.note{font-size:13px;line-height:1.5;color:#6e6e73}@media(max-width:500px){.axes,.status{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><h1>TinyBee · 5 trục</h1><p><span id="dot" class="dot"></span><span id="connection">Đang kết nối MQTT…</span></p>
<section class="card"><div class="grid"><div><label>Tốc độ tối đa (step/s)</label><input id="speed" type="number" min="1" max="20000" value="5000"></div><div><label>Gia tốc (step/s²)</label><input id="accel" type="number" min="1" max="100000" value="20000"></div></div><div class="axes" style="margin-top:14px"><div><label>X</label><input class="single" value="0"></div><div><label>Y</label><input class="single" value="0"></div><div><label>Z</label><input class="single" value="0"></div><div><label>E0</label><input class="single" value="0"></div><div><label>E1</label><input class="single" value="0"></div></div><div class="buttons"><button onclick="sendSingle()">Chạy 1 lệnh</button><button class="stop" onclick="send('STOP')">DỪNG</button></div></section>
<section class="card"><label>Hàng đợi lệnh (5 số có dấu: X Y Z E0 E1)</label><textarea id="commands" spellcheck="false">10 15 18 30 40| -10 0 0 0 0</textarea><div class="buttons"><button onclick="sendQueue()">Gửi hàng đợi</button><button onclick="send('ZERO')">Đặt lại vị trí</button></div><p class="note">Ví dụ <code>10 15 18 30 40| -10 0 0 0 0</code>: mỗi nhóm là một chuyển động tương đối. Dấu âm đảo chiều. Các trục trong cùng nhóm khởi động và kết thúc đồng thời; board tự phát xung STEP.</p></section>
<section class="card"><div class="status"><div class="axis"><b>X</b><span id="p0">0</span></div><div class="axis"><b>Y</b><span id="p1">0</span></div><div class="axis"><b>Z</b><span id="p2">0</span></div><div class="axis"><b>E0</b><span id="p3">0</span></div><div class="axis"><b>E1</b><span id="p4">0</span></div></div><p class="muted" id="motion">Chưa có trạng thái.</p></section></main><script>
const TOPIC='tinybee/test123/axes/cmd',STATE='tinybee/test123/axes/state';const $=id=>document.getElementById(id);const dot=$('dot'),ct=$('connection');
const client=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{clientId:'TinyBee5Web-'+Math.random().toString(16).slice(2),reconnectPeriod:3000});
function status(ok,text){dot.className='dot '+(ok?'ok':'bad');ct.textContent=text}function send(text){if(!client.connected)return alert('MQTT chưa kết nối.');client.publish(TOPIC,text)}
client.on('connect',()=>{status(true,'Đã kết nối MQTT');client.subscribe(STATE);send('STATUS')});client.on('reconnect',()=>status(false,'Đang kết nối lại…'));client.on('close',()=>status(false,'MQTT đã ngắt'));client.on('error',()=>status(false,'Lỗi MQTT'));
client.on('message',(topic,payload)=>{if(topic!==STATE)return;try{let d=JSON.parse(payload);d.position.forEach((v,i)=>$('p'+i).textContent=v);$('motion').textContent=(d.moving?'Đang chạy':'Dừng')+' · còn '+d.remaining+' step · '+d.speed+' step/s · hàng đợi '+d.queue}catch(e){console.error(e)}});
function settings(){let s=Math.max(1,Math.min(20000,Number($('speed').value)||5000)),a=Math.max(1,Math.min(100000,Number($('accel').value)||20000));send('SPEED '+s);send('ACCEL '+a)}function sendSingle(){settings();send([...document.querySelectorAll('.single')].map(x=>parseInt(x.value)||0).join(' '))}function sendQueue(){settings();let q=$('commands').value.trim();if(!q)return;let valid=q.split('|').every(x=>x.trim().split(/\s+/).length===5);if(!valid)return alert('Mỗi lệnh phải gồm đúng 5 số.');send(q)}
</script></body></html>
