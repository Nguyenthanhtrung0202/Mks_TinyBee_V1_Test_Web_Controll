<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyBee Motion</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: #ffffff;
      --ink: #1d1d1f;
      --muted: #77777e;
      --line: #e5e5ea;
      --dark: #29292b;
      --green: #248a3d;
      --red: #d70015;
      --shadow: 0 18px 50px rgba(0, 0, 0, .06);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: var(--bg); color: var(--ink);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .page { width: min(100%, 680px); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 4px 22px; }
    h1 { margin: 0; font-size: 25px; line-height: 1.1; letter-spacing: -.8px; font-weight: 750; }
    .subtitle { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .connection { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #b8b8bf; flex: 0 0 auto; }
    .dot.online { background: var(--green); }
    .dot.error { background: var(--red); }
    .card { padding: 25px; background: var(--card); border: 1px solid rgba(0,0,0,.025); border-radius: 24px; box-shadow: var(--shadow); }
    .field { min-width: 0; }
    label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 700; letter-spacing: .055em; color: var(--muted); }
    textarea, input {
      width: 100%; border: 1px solid var(--line); border-radius: 13px; background: #fafafd;
      color: var(--ink); font: inherit; outline: none; transition: border-color .15s, background .15s;
    }
    textarea { min-height: 150px; padding: 15px; resize: vertical; line-height: 1.7; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; }
    input { padding: 13px 14px; font-size: 15px; }
    textarea:focus, input:focus { border-color: #9999a1; background: white; }
    .hint { margin: 9px 2px 0; color: var(--muted); font-size: 12px; }
    .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 20px; }
    .send { width: 100%; margin-top: 20px; border: 0; border-radius: 13px; padding: 14px 18px; background: var(--dark); color: white; font: inherit; font-weight: 650; cursor: pointer; transition: opacity .15s, transform .15s; }
    .send:hover:not(:disabled) { opacity: .9; }
    .send:active:not(:disabled) { transform: scale(.99); }
    .send:disabled { opacity: .55; cursor: wait; }
    .feedback { min-height: 20px; margin: 13px 2px 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .feedback.error { color: var(--red); }
    .feedback.success { color: var(--green); }
    @media (max-width: 520px) {
      body { padding: 18px 13px; align-items: start; }
      header { align-items: flex-start; margin-bottom: 18px; }
      h1 { font-size: 23px; }
      .connection { max-width: 130px; white-space: normal; justify-content: flex-end; text-align: right; }
      .card { padding: 19px; border-radius: 19px; }
      .settings { gap: 10px; }
      textarea { min-height: 140px; }
    }
    @media (max-width: 360px) { .settings { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>TinyBee Motion</h1>
        <div class="subtitle">Điều khiển chuyển động qua MQTT</div>
      </div>
      <div class="connection"><i id="dot" class="dot"></i><span id="connection">Đang kết nối MQTT…</span></div>
    </header>

    <section class="card" aria-label="Lệnh chuyển động">
      <div class="field">
        <label for="commands">CHUỖI TỌA ĐỘ ĐÍCH · MM</label>
        <textarea id="commands" spellcheck="false" autocapitalize="off">10 15 18 30 40| 0 0 0 0 0</textarea>
        <p class="hint">Mỗi nhóm gồm X Y Z E0 E1. Dùng dấu | để nối nhiều điểm đích.</p>
      </div>

      <div class="settings">
        <div class="field">
          <label for="speed">VẬN TỐC TỐI ĐA · STEP/S</label>
          <input id="speed" type="number" min="1" max="50000" step="1" value="50000" inputmode="numeric">
        </div>
        <div class="field">
          <label for="acceleration">GIA TỐC · STEP/S²</label>
          <input id="acceleration" type="number" min="0" max="100000" step="1" value="20000" inputmode="numeric">
        </div>
      </div>

      <button id="sendButton" class="send" type="button">Gửi lệnh</button>
      <div id="feedback" class="feedback" role="status" aria-live="polite">Nhập chuỗi tọa độ, vận tốc và gia tốc rồi nhấn Gửi lệnh.</div>
    </section>
  </main>

  <script>
    const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
    const COMMAND_TOPIC = 'tinybee/test123/axes/cmd';
    const STATE_TOPIC = 'tinybee/test123/axes/state';
    const AVAILABILITY_TOPIC = 'tinybee/test123/axes/availability';
    const MAX_SPEED = 50000;
    const MAX_ACCEL = 100000;
    const MAX_TRAVEL_MM = 350;
    const MAX_TARGETS = 16;
    const MAX_COMMAND_LENGTH = 400;

    const $ = (id) => document.getElementById(id);
    const sendButton = $('sendButton');
    const feedback = $('feedback');
    let boardOnline = false;
    let isSending = false;

    const client = mqtt.connect(MQTT_URL, {
      clientId: 'tinybee-web-' + crypto.getRandomValues(new Uint32Array(1))[0].toString(16),
      clean: true,
      reconnectPeriod: 3000,
      connectTimeout: 10000
    });

    function setConnection(text, state = '') {
      $('connection').textContent = text;
      $('dot').className = 'dot ' + state;
    }

    function setFeedback(text, kind = '') {
      feedback.textContent = text;
      feedback.className = 'feedback ' + kind;
    }

    function parseAndValidateCommands(raw) {
      const source = raw.trim();
      if (!source) throw new Error('Bạn chưa nhập chuỗi tọa độ.');
      if (source.length > MAX_COMMAND_LENGTH) throw new Error(`Chuỗi lệnh quá dài; giới hạn ${MAX_COMMAND_LENGTH} ký tự.`);

      const segments = source.split('|').map((part) => part.trim()).filter(Boolean);
      if (segments.length === 0) throw new Error('Không tìm thấy tọa độ đích hợp lệ.');
      if (segments.length > MAX_TARGETS) throw new Error(`Chỉ được gửi tối đa ${MAX_TARGETS} điểm đích trong một lần.`);

      for (let index = 0; index < segments.length; index++) {
        const values = segments[index].split(/\s+/).map(Number);
        if (values.length !== 5 || values.some((value) => !Number.isFinite(value))) {
          throw new Error(`Nhóm ${index + 1} phải có đúng 5 số theo thứ tự X Y Z E0 E1.`);
        }
        if (values.some((value) => value < 0 || value > MAX_TRAVEL_MM)) {
          throw new Error(`Nhóm ${index + 1}: mỗi tọa độ phải nằm trong khoảng 0–${MAX_TRAVEL_MM} mm.`);
        }
      }
      return segments.join(' | ');
    }

    function readInteger(id, label, min, max) {
      const text = $(id).value.trim();
      if (text === '') throw new Error(`Vui lòng nhập ${label.toLowerCase()}.`);
      const number = Number(text);
      if (!Number.isFinite(number) || !Number.isInteger(number) || number < min || number > max) {
        throw new Error(`${label} phải là số nguyên từ ${min} đến ${max}.`);
      }
      return number;
    }

    function publishInOrder(commands, index = 0) {
      if (index >= commands.length) {
        isSending = false;
        sendButton.disabled = false;
        setFeedback('Đã gửi cài đặt và chuỗi tọa độ đến TinyBee. Chờ board cập nhật trạng thái.', 'success');
        return;
      }

      const command = commands[index];
      setFeedback(`Đang gửi ${index + 1}/${commands.length}: ${command}`);
      client.publish(COMMAND_TOPIC, command, { qos: 0, retain: false }, (error) => {
        if (error) {
          isSending = false;
          sendButton.disabled = false;
          setFeedback(`Gửi thất bại tại lệnh “${command}”: ${error.message || error}`, 'error');
          return;
        }
        publishInOrder(commands, index + 1);
      });
    }

    sendButton.addEventListener('click', () => {
      if (isSending) return;
      if (!client.connected) {
        setFeedback('Web chưa kết nối MQTT. Hãy chờ kết nối rồi thử lại.', 'error');
        return;
      }

      let speed;
      let acceleration;
      let coordinateString;
      try {
        speed = readInteger('speed', 'Vận tốc tối đa', 1, MAX_SPEED);
        acceleration = readInteger('acceleration', 'Gia tốc', 0, MAX_ACCEL);
        coordinateString = parseAndValidateCommands($('commands').value);
      } catch (error) {
        setFeedback(error.message, 'error');
        return;
      }

      isSending = true;
      sendButton.disabled = true;
      publishInOrder([
        `SPEED ${speed}`,
        `ACCEL ${acceleration}`,
        coordinateString
      ]);
    });

    client.on('connect', () => {
      setConnection('Đã kết nối MQTT');
      client.subscribe([STATE_TOPIC, AVAILABILITY_TOPIC], (error) => {
        if (error) setFeedback('Đã kết nối MQTT nhưng không đăng ký được trạng thái board.', 'error');
      });
    });
    client.on('reconnect', () => setConnection('Đang kết nối lại…'));
    client.on('close', () => {
      boardOnline = false;
      setConnection('Đã ngắt MQTT', 'error');
    });
    client.on('error', () => setConnection('Lỗi kết nối MQTT', 'error'));
    client.on('message', (topic, payload) => {
      const message = payload.toString();
      if (topic === AVAILABILITY_TOPIC) {
        boardOnline = message === 'online';
        setConnection(boardOnline ? 'TinyBee trực tuyến' : 'TinyBee ngoại tuyến', boardOnline ? 'online' : 'error');
        return;
      }
      if (topic !== STATE_TOPIC) return;
      try {
        const state = JSON.parse(message);
        const motion = state.moving ? 'Đang chuyển động' : 'Đang chờ';
        const queue = Number.isFinite(Number(state.queue)) ? ` · hàng đợi ${state.queue}` : '';
        if (!isSending) setFeedback(`${motion}${queue}${state.message ? ' · ' + state.message : ''}`, state.message && String(state.message).startsWith('Rejected') ? 'error' : '');
      } catch (_) {
        // Ignore malformed retained state messages.
      }
    });
  </script>
</body>
</html>
